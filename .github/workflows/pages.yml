name: Mirror app/ to gh-pages
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish app/ to gh-pages root
        run: |
          touch app/.nojekyll
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin gh-pages || true
          git worktree add -B gh-pages /tmp/site origin/gh-pages || git worktree add -B gh-pages /tmp/site
          cp -r app/. /tmp/site/
          cd /tmp/site
          git add -A
          git commit -m "Publish app/ from ${GITHUB_SHA::7}" || echo "nothing to publish"
          git push origin gh-pages
